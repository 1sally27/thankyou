<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선물이 도착했어요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--pk:#ff6fae;--pk2:#ffb3d1;--vi:#b58cff;--ink:#5b3552;--mut:#b08aa3;--line:#f6d3e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink);background:#fff}
button{font-family:inherit;cursor:pointer}
.app{display:flex;height:100vh;height:100dvh}

/* ---------- PANEL ---------- */
.panel{width:390px;flex:none;overflow:auto;padding:26px 22px 40px;background:#fffafc;border-right:2px solid var(--line);z-index:5}
.panel h1{font-weight:400;font-size:28px;margin:0 0 20px;color:var(--pk);text-shadow:0 0 12px rgba(255,111,174,.35)}
.sec{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px;box-shadow:0 0 18px rgba(255,111,174,.12)}
.lb{font-size:17px;margin-bottom:10px}
.lb span{font-size:13px;color:var(--mut);margin-left:6px}

.drop{position:relative;border:2px dashed #f5a9c9;border-radius:14px;height:150px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);background:#fff4f9;overflow:hidden;cursor:pointer;padding:10px;line-height:1.5;transition:.2s}
.drop.over{background:#ffe6f1;border-color:var(--pk);box-shadow:0 0 16px rgba(255,111,174,.45)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.drop.has img{display:block}.drop.has .dt{display:none}
.drop .chg{position:absolute;right:8px;bottom:8px;background:rgba(91,53,82,.7);color:#fff;font-size:12px;padding:3px 10px;border-radius:99px;display:none}
.drop.has .chg{display:block}
.dt b{display:block;font-size:18px;color:var(--ink);font-weight:400}

textarea{width:100%;height:90px;border:2px solid var(--line);border-radius:14px;padding:11px 13px;font:inherit;font-size:17px;color:var(--ink);resize:none;outline:none;background:#fff}
textarea:focus{border-color:var(--pk);box-shadow:0 0 12px rgba(255,111,174,.3)}
.cnt{text-align:right;font-size:12px;color:var(--mut);margin-top:4px}

.songs{display:flex;flex-direction:column;gap:7px}
.song{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-size:16px;color:var(--ink);text-align:left}
.song .ic{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.song.on{border-color:var(--pk);background:#fff0f7;box-shadow:0 0 12px rgba(255,111,174,.3)}
.song.on .ic{background:var(--pk);color:#fff}

.colors{display:flex;gap:9px}
.sw{flex:1;border:0;background:none;padding:0;text-align:center;font-size:12px;color:var(--mut)}
.sw i{display:block;width:100%;aspect-ratio:1;border-radius:50%;margin-bottom:5px;border:2px solid rgba(181,140,255,.4);transition:.15s}
.sw.on i{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--pk),0 0 14px rgba(255,111,174,.6)}
.sw.on{color:var(--ink)}

.go{width:100%;border:0;border-radius:99px;padding:15px;font-size:19px;color:#fff;background:linear-gradient(135deg,#ff9cc7,#ff5fa5);box-shadow:0 0 20px rgba(255,95,165,.5)}
.go:active{transform:translateY(1px)}
.result{display:none;margin-top:16px;padding:13px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.result.show{display:block}
.result input{width:100%;border:0;background:#fff4f9;border-radius:10px;padding:10px;font-size:12px;color:#777;margin-bottom:10px;font-family:monospace}
.rb{display:flex;gap:8px}
.rb button,.rb a{flex:1;text-align:center;text-decoration:none;color:var(--ink);border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font-size:15px}
.rb .pri{background:var(--pk);border-color:var(--pk);color:#fff}
.note{font-size:12px;color:var(--mut);margin-top:9px;line-height:1.5}

/* ---------- PREVIEW ---------- */
.preview{flex:1;position:relative;min-width:0;overflow:hidden;background:
  radial-gradient(circle at 12% 18%,rgba(255,170,205,.28),transparent 42%),
  radial-gradient(circle at 88% 70%,rgba(255,170,205,.28),transparent 42%),
  radial-gradient(circle at 70% 8%,rgba(200,170,255,.2),transparent 40%),#fff}
.bgh{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hrt{position:absolute;filter:drop-shadow(0 0 9px rgba(255,90,160,.55));animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-14px) rotate(calc(var(--r) + 5deg))}}
.spk{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 8px 4px rgba(255,120,180,.55);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}

.fit{position:absolute;inset:0;overflow:hidden}
.bar{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px;z-index:20;padding:0 12px}
.pill{border:0;border-radius:99px;padding:10px 20px;font-size:15px;background:#fff;color:var(--ink);box-shadow:0 0 16px rgba(255,111,174,.4);text-decoration:none}

.stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0}
.scene{position:absolute;inset:0;perspective:1000px;perspective-origin:50% 55%}
.shadow{position:absolute;left:78px;top:546px;width:204px;height:36px;border-radius:50%;background:radial-gradient(rgba(255,80,150,.35),transparent 70%)}
.box{position:absolute;left:180px;top:500px;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(-30deg)}

.body{position:absolute;left:-80px;top:-60px;width:160px;height:120px;transform-style:preserve-3d}
.f{position:absolute;background:var(--c);box-shadow:inset 0 0 0 2px rgba(150,100,210,.4)}
.s::after{content:'';position:absolute;left:50%;margin-left:-14px;width:28px;top:0;bottom:0;background:var(--r);box-shadow:inset 0 0 0 2px rgba(150,100,210,.25)}
.body .s{width:160px;height:120px}
.body .front{transform:translateZ(80px)}
.body .back{transform:rotateY(180deg) translateZ(80px);filter:brightness(.8)}
.body .left{transform:rotateY(-90deg) translateZ(80px);filter:brightness(.9)}
.body .right{transform:rotateY(90deg) translateZ(80px);filter:brightness(.82)}
.body .bottom{width:160px;height:160px;top:-20px;transform:rotateX(-90deg) translateZ(60px);filter:brightness(.72)}

.lid{position:absolute;left:-88px;top:-90px;width:176px;height:30px;transform-style:preserve-3d;transform-origin:50% 100% -88px;transition:transform 1s cubic-bezier(.3,1.25,.5,1)}
.box.open .lid{transform:translate3d(0,-6px,-10px) rotateX(165deg)}
.lid .f{background:var(--l)}
.lid .s{width:176px;height:30px}
.lid .front{transform:translateZ(88px)}
.lid .back{transform:rotateY(180deg) translateZ(88px);filter:brightness(.82)}
.lid .left{transform:rotateY(-90deg) translateZ(88px);filter:brightness(.9)}
.lid .right{transform:rotateY(90deg) translateZ(88px);filter:brightness(.82)}
.lid .top{width:176px;height:176px;top:-73px;transform:rotateX(90deg) translateZ(15px);filter:brightness(1.05)}
.lid .top::before{content:'';position:absolute;top:50%;margin-top:-14px;left:0;right:0;height:28px;background:var(--r);box-shadow:inset 0 0 0 2px rgba(150,100,210,.25)}
.lid .top::after{content:'';position:absolute;left:50%;margin-left:-14px;width:28px;top:0;bottom:0;background:var(--r);box-shadow:inset 0 0 0 2px rgba(150,100,210,.25)}

.bow{position:absolute;left:88px;top:-1px;width:0;height:0;transform-style:preserve-3d}
.bp{position:absolute;left:-42px;top:-32px;width:84px;height:32px}
.bp.p2{transform:rotateY(90deg)}
.lp{position:absolute;top:0;width:42px;height:30px;border:8px solid var(--r);border-radius:50%;box-shadow:0 0 0 1.5px rgba(150,100,210,.45),inset 0 0 0 1.5px rgba(150,100,210,.45)}
.lp.a{left:0;transform:rotate(-20deg)}.lp.b{right:0;transform:rotate(20deg)}
.kn{position:absolute;left:34px;top:14px;width:16px;height:16px;border-radius:5px;background:var(--r);box-shadow:0 0 0 1.5px rgba(150,100,210,.45)}

/* 상자 안(3D 공간)에 있는 카드: 상자 앞면 벽 뒤, 뚜껑 앞 */
.card{position:absolute;left:-118px;bottom:-30px;width:236px;padding:10px 10px 12px;background:#fff;border-radius:12px;box-shadow:0 0 0 2px rgba(181,140,255,.4),0 0 26px rgba(255,95,165,.5);transform-origin:50% 100%;opacity:0;text-align:center;will-change:transform}
.card .ph{height:156px;border-radius:7px;overflow:hidden;background:#f6e3ea}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card.nophoto .ph{display:none}
.card p{margin:10px 2px 0;font-size:20px;line-height:1.3;color:var(--ink);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.card p:empty{display:none}

#cf{position:absolute;inset:0;pointer-events:none;z-index:6}
.hint{position:absolute;left:10px;right:10px;top:64px;text-align:center;font-size:22px;color:var(--pk);text-shadow:0 0 10px rgba(255,111,174,.45);z-index:7;pointer-events:none;transition:opacity .4s}
.hint.hide{opacity:0}
.hint.pulse span{display:inline-block;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.07)}}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(91,53,82,.92);color:#fff;padding:10px 20px;border-radius:99px;font-size:15px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}

body.viewer .panel{display:none}
body.viewer .stage{cursor:pointer}
@media (max-width:820px){
  .app{flex-direction:column;height:auto}
  .panel{width:100%;border-right:0;border-bottom:2px solid var(--line);overflow:visible}
  .preview{height:calc(100dvh - 24px);min-height:540px}
  body.viewer .app{height:100dvh}
  body.viewer .preview{height:100dvh}
}
@media (prefers-reduced-motion:reduce){.hrt,.spk{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="hf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2dc"/><stop offset="1" stop-color="#ff7fb2"/></linearGradient>
    <linearGradient id="hs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a98cff"/><stop offset=".5" stop-color="#ff9cc9"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs>
</svg>

<div class="app">
  <aside class="panel" id="panel">
    <h1>선물 상자 만들기</h1>

    <div class="sec">
      <div class="lb">사진 <span id="dropSub">끌어다 놓아도 돼요</span></div>
      <div class="drop" id="drop" role="button" tabindex="0">
        <img id="thumb" alt="">
        <div class="dt"><b>사진 선택</b><span id="dropTxt">클릭하거나 끌어다 놓으세요</span></div>
        <div class="chg">사진 바꾸기</div>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <div class="sec">
      <div class="lb">멘트</div>
      <textarea id="msg" maxlength="50" placeholder="전하고 싶은 말을 적어주세요"></textarea>
      <div class="cnt"><span id="cnt">0</span>/50</div>
    </div>

    <div class="sec">
      <div class="lb">노래</div>
      <div class="songs" id="songs"></div>
    </div>

    <div class="sec">
      <div class="lb">상자 색</div>
      <div class="colors" id="colors"></div>
    </div>

    <button class="go" id="go">링크 생성하기</button>
    <div class="result" id="result">
      <input id="url" readonly>
      <div class="rb">
        <button class="pri" id="copy">복사</button>
        <button id="share">공유</button>
        <a id="try" target="_blank" rel="noopener">미리보기</a>
      </div>
      <div class="note">링크 안에 사진과 멘트가 모두 들어 있어요. 사진은 자동으로 작게 줄여서 담습니다.</div>
    </div>
  </aside>

  <main class="preview" id="preview">
    <div class="bgh" id="bgh"></div>
    <div class="fit" id="fit">
      <div class="stage" id="stage">
        <div class="scene">
          <div class="shadow"></div>
          <div class="box idle" id="box">
            <div class="body">
              <div class="f s front"></div><div class="f s back"></div><div class="f s left"></div><div class="f s right"></div><div class="f bottom"></div>
            </div>
            <div class="lid">
              <div class="f s front"></div><div class="f s back"></div><div class="f s left"></div><div class="f s right"></div><div class="f top"></div>
              <div class="bow">
                <div class="bp"><div class="lp a"></div><div class="lp b"></div><div class="kn"></div></div>
                <div class="bp p2"><div class="lp a"></div><div class="lp b"></div><div class="kn"></div></div>
              </div>
            </div>
            <div class="card nophoto" id="card"><div class="ph"><img id="cardImg" alt=""></div><p id="cardMsg"></p></div>
          </div>
        </div>
        <canvas id="cf" width="360" height="640"></canvas>
        <div class="hint" id="hint"><span>사진을 올리면 선물이 열려요</span></div>
      </div>
    </div>
    <div class="bar" id="bar"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 설정: 노래는 깃허브 songs/ 폴더에 올린 파일명과 맞춰주세요 ============ */
const SONGS = [
  { name: '노래 1', file: 'songs/song1.mp3' },
  { name: '노래 2', file: 'songs/song2.mp3' },
  { name: '노래 3', file: 'songs/song3.mp3' },
];
const COLORS = {
  pink:   { label:'핑크',   c:'#ffb3d1', l:'#ff9cc4', r:'#ffffff' },
  mint:   { label:'민트',   c:'#a8f0d8', l:'#8ae6c8', r:'#ffffff' },
  yellow: { label:'옐로우', c:'#fff1a0', l:'#ffe97a', r:'#ffb3d1' },
  white:  { label:'화이트', c:'#ffffff', l:'#f5f1fa', r:'#ffb3d1' },
  black:  { label:'블랙',   c:'#3b3b46', l:'#2b2b34', r:'#ffc2dc' },
};
/* ================================================================================ */

const $ = id => document.getElementById(id);
const st = { photo:'', msg:'', song: SONGS[0] ? SONGS[0].file : '', color:'pink' };
const audio = new Audio(); audio.loop = true; audio.preload = 'auto';
let loadedSong = '', muted = false;

function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),2000); }

/* ---------- 배경: 몽글몽글 하트 + 반짝이 ---------- */
(function buildBg(){
  const H=[ // x%, y%, size, rotate, delay
    [4,6,92,-10,0],[80,3,64,12,1.2],[92,2,40,-6,2.4],[6,40,74,-8,.6],[84,34,92,10,1.8],
    [88,62,48,14,.3],[10,82,120,-8,1.1],[72,86,64,-14,2.1],[40,92,34,8,.9],[28,3,30,6,1.6]
  ];
  const path='M50 86 C8 56 0 36 0 22 C0 9 11 0 25 0 C36 0 46 6 50 15 C54 6 64 0 75 0 C89 0 100 9 100 22 C100 36 92 56 50 86Z';
  const g=$('bgh'); let h='';
  H.forEach(([x,y,s,r,d])=>{
    h+=`<svg class="hrt" viewBox="-4 -4 108 94" style="left:${x}%;top:${y}%;width:${s}px;--r:${r}deg;animation-delay:${d}s"><path d="${path}" fill="url(#hf)" fill-opacity=".85" stroke="url(#hs)" stroke-width="4"/><ellipse cx="26" cy="22" rx="9" ry="5" fill="#fff" fill-opacity=".55" transform="rotate(-30 26 22)"/></svg>`;
  });
  [[22,22,7],[62,10,9],[48,30,5],[94,48,8],[16,64,6],[58,78,7],[34,50,5],[76,56,6],[3,22,6],[66,94,5]].forEach(([x,y,s],i)=>{
    h+=`<span class="spk" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-delay:${(i*.45).toFixed(2)}s"></span>`;
  });
  g.innerHTML=h;
})();

function fit(){
  const f=$('fit'), w=f.clientWidth, h=f.clientHeight;
  const s=Math.min(w/360,(h-60)/640,1.5);
  $('stage').style.transform=`translate(${(w-360*s)/2}px,${Math.max(0,(h-640*s)/2-10)}px) scale(${s})`;
}
new ResizeObserver(fit).observe($('fit')); addEventListener('resize',fit);

function applyColor(){ const c=COLORS[st.color]||COLORS.pink, b=$('box').style; b.setProperty('--c',c.c); b.setProperty('--l',c.l); b.setProperty('--r',c.r); }
function applyMsg(){ $('cardMsg').textContent = st.msg.trim(); }
function applyPhoto(){ $('card').classList.toggle('nophoto',!st.photo); if(st.photo) $('cardImg').src=st.photo; }
function playSong(){
  if(!st.song || muted){ audio.pause(); return; }
  if(loadedSong!==st.song){ audio.src=st.song; loadedSong=st.song; }
  audio.play().catch(()=>{});
}

/* ---------- 상자 연출 ---------- */
const TILT=14, SPIN=40;            /* SPIN: 열린 뒤 회전 속도(도/초) */
let th=-30, vel=0, spin=false, cardStart=-1, lastTs=0, timers=[];
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
const easeOutBack=x=>{const c1=1.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const smooth=x=>x*x*(3-2*x);
function frame(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000||0); lastTs=ts;
  if(!spin){ const tg=-30+10*Math.sin(ts/800); const k=360*Math.round((th-tg)/360); th+=((tg+k)-th)*Math.min(1,dt*4); vel=0; }
  else { vel+=(SPIN-vel)*Math.min(1,dt*1.5); th+=vel*dt; }
  $('box').style.transform=`rotateX(-${TILT}deg) rotateY(${th}deg)`;
  let ty=0, sc=.3, rz=0, op=0;
  if(cardStart>=0){
    const t=(ts-cardStart)/1000, p=Math.min(1,t/1.1);
    ty=-150*easeOutBack(p); sc=.3+.7*smooth(Math.max(0,(p-.4)/.6)); op=Math.min(1,t/.12);
    if(t>1.1){ const u=t-1.1; ty-=5*Math.sin(u*2.2); rz=2.5*Math.sin(u*1.4); } else rz=-2*p;
  }
  const c=$('card'); c.style.opacity=op;
  /* 상자가 돌아도 카드는 항상 정면을 보도록 역회전 */
  c.style.transform=`translateY(${ty}px) rotateY(${-th}deg) rotateX(${TILT}deg) rotate(${rz}deg) scale(${sc})`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function openBox(){
  $('box').classList.add('open'); $('hint').classList.add('hide'); spin=true;
  later(()=>{ $('card').classList.add('show'); cardStart=performance.now(); confetti(); },500);
}
function resetBox(){
  timers.forEach(clearTimeout); timers=[];
  $('card').classList.remove('show'); cardStart=-1; spin=false; $('box').classList.remove('open');
}
function replay(){ resetBox(); later(openBox,1100); }

/* ---------- 컨페티 ---------- */
let cfRun=0;
function confetti(){
  const cv=$('cf'), ctx=cv.getContext('2d'); const id=++cfRun;
  const cols=['#ff6fae','#b58cff','#ffd36e','#7fe3c8','#8fc8ff','#ffb3d1'];
  const P=Array.from({length:120},()=>({x:180+(Math.random()-.5)*60,y:430,vx:(Math.random()-.5)*10,vy:-(7+Math.random()*10),
    w:5+Math.random()*6,h:8+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0],dot:Math.random()<.25}));
  let t=0;
  (function f(){
    if(id!==cfRun) return;
    ctx.clearRect(0,0,360,640); t++;
    for(const p of P){ p.vy+=.28; p.vx*=.992; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      if(p.dot){ ctx.beginPath(); ctx.arc(0,0,p.w/2,0,7); ctx.fill(); } else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore(); }
    if(t<270) requestAnimationFrame(f); else ctx.clearRect(0,0,360,640);
  })();
}

/* ---------- 이미지 ---------- */
const loadImg=src=>new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src; });
function toJpeg(img,max,q){
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q);
}
async function handleFile(file){
  if(!file || !file.type.startsWith('image/')){ toast('이미지 파일만 올릴 수 있어요'); return; }
  try{ const url=URL.createObjectURL(file); const img=await loadImg(url); URL.revokeObjectURL(url); st.photo=toJpeg(img,560,.74); }
  catch(e){ toast('사진을 불러오지 못했어요'); return; }
  $('thumb').src=st.photo; $('drop').classList.add('has');
  applyPhoto(); playSong(); replay();
  if(matchMedia('(max-width:820px)').matches) $('fit').scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- 링크 ---------- */
async function makeLink(){
  if(!st.photo){ toast('사진을 먼저 올려주세요'); return; }
  let p=st.photo.split(',')[1];
  if(p.length>140000){ p=toJpeg(await loadImg(st.photo),420,.6).split(',')[1]; }
  const url=location.href.split('#')[0]+'#m='+encodeURIComponent(st.msg.trim())+'&s='+encodeURIComponent(st.song)+'&c='+st.color+'&p='+p;
  $('url').value=url; $('try').href=url; $('result').classList.add('show');
  $('result').scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function copyLink(){
  try{ await navigator.clipboard.writeText($('url').value); }catch(e){ $('url').select(); document.execCommand('copy'); }
  toast('링크가 복사됐어요');
}

/* ---------- 받는 사람 화면 ---------- */
function parseHash(){
  const raw=location.hash.slice(1); if(!raw) return null;
  const o={}; raw.split('&').forEach(kv=>{ const i=kv.indexOf('='); if(i>0) o[kv.slice(0,i)]=kv.slice(i+1); });
  let m='',s=''; try{ m=decodeURIComponent(o.m||''); }catch(e){} try{ s=decodeURIComponent(o.s||''); }catch(e){}
  let p=(o.p||'').replace(/ /g,'+').replace(/%2B/gi,'+').replace(/%2F/gi,'/').replace(/%3D/gi,'=');
  if(!/^[A-Za-z0-9+/=]*$/.test(p)) p='';
  return { m, s: SONGS.some(x=>x.file===s)?s:'', c: COLORS[o.c]?o.c:'pink', p };
}
function initViewer(d){
  document.body.classList.add('viewer');
  st.msg=d.m; st.song=d.s; st.color=d.c; st.photo=d.p?('data:image/jpeg;base64,'+d.p):'';
  applyColor(); applyMsg(); applyPhoto();
  const hint=$('hint'); hint.classList.add('pulse'); hint.firstElementChild.textContent='눌러서 열어보세요';
  $('bar').innerHTML='<button class="pill" id="mute">음악 끄기</button><a class="pill" href="'+location.pathname+'">나도 만들기</a>';
  $('mute').onclick=()=>{ muted=!muted; $('mute').textContent=muted?'음악 켜기':'음악 끄기'; muted?audio.pause():playSong(); };
  let opened=false;
  $('stage').addEventListener('click',()=>{
    if(opened){ if($('card').classList.contains('show')) confetti(); return; }
    opened=true; hint.classList.remove('pulse'); playSong(); openBox();
  });
  fit();
}

/* ---------- 만드는 화면 ---------- */
function initCreator(){
  applyColor(); applyMsg(); applyPhoto();
  if(matchMedia('(pointer:coarse)').matches){ $('dropSub').textContent=''; $('dropTxt').textContent='눌러서 사진첩에서 선택하세요'; }
  const drop=$('drop'), file=$('file');
  drop.onclick=()=>file.click();
  drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); file.click(); } };
  file.onchange=()=>{ handleFile(file.files[0]); file.value=''; };
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop',e=>handleFile(e.dataTransfer.files[0]));
  addEventListener('dragover',e=>e.preventDefault()); addEventListener('drop',e=>e.preventDefault());

  $('msg').oninput=e=>{ st.msg=e.target.value; $('cnt').textContent=[...st.msg].length; applyMsg(); };

  const sl=$('songs');
  [...SONGS,{name:'음악 없음',file:''}].forEach(s=>{
    const b=document.createElement('button'); b.className='song'+(s.file===st.song?' on':'');
    b.innerHTML='<span class="ic">'+(s.file?'♪':'×')+'</span><span></span>'; b.lastChild.textContent=s.name;
    b.onclick=()=>{ st.song=s.file; [...sl.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); muted=false; playSong(); };
    sl.appendChild(b);
  });
  const cl=$('colors');
  Object.entries(COLORS).forEach(([k,v])=>{
    const b=document.createElement('button'); b.className='sw'+(k===st.color?' on':'');
    b.innerHTML='<i style="background:'+v.c+'"></i>'+v.label;
    b.onclick=()=>{ st.color=k; [...cl.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); applyColor(); };
    cl.appendChild(b);
  });
  $('go').onclick=makeLink; $('copy').onclick=copyLink;
  $('share').onclick=async()=>{ const u=$('url').value; if(navigator.share){ try{ await navigator.share({title:'선물이 도착했어요',url:u}); }catch(e){} } else copyLink(); };
  $('bar').innerHTML='<button class="pill" id="re">다시 보기</button>';
  $('re').onclick=()=>{ if(!st.photo){ toast('사진을 먼저 올려주세요'); return; } playSong(); replay(); };
  fit();
}

const data=parseHash();
data ? initViewer(data) : initCreator();
addEventListener('hashchange',()=>location.reload());
</script>
</body>
</html>
